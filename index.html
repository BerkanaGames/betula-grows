<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Betula Grows</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Look after Betula, a small birch tree, through a 24-hour life.">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="device">
    <header class="device-header">
      <h1 class="device-title">Betula Grows</h1>
      <button id="menu-button" class="menu-button" type="button" aria-label="Menu">⋯</button>
    </header>

    <div class="screen-frame">
      <canvas id="screen" class="screen" aria-label="Betula's screen"></canvas>
    </div>

    <button id="gift-message" class="gift-message" type="button" hidden></button>

    <div class="need-buttons">
      <button class="need-button" type="button" data-need="water">
        <span class="need-emoji" aria-hidden="true">💧</span>
        Water
      </button>
      <button class="need-button" type="button" data-need="sun">
        <span class="need-emoji" aria-hidden="true">☀️</span>
        Sun
      </button>
      <button class="need-button" type="button" data-need="company">
        <span class="need-emoji" aria-hidden="true">💚</span>
        Company
      </button>
    </div>

    <section class="shelf">
      <h2 class="shelf-title">Collection</h2>
      <div id="shelf" class="shelf-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="/impressum">Legal Notice (Impressum)</a>
    ·
    <a href="/privacy">Privacy</a>
  </footer>

  <!-- Small menu with a two-step reset, so nothing is erased by accident -->
  <dialog id="menu" class="menu">
    <div id="menu-main" class="menu-step">
      <h2 class="menu-title">Menu</h2>
      <button id="reset-button" class="menu-action danger" type="button">Reset Betula</button>
      <button id="close-menu-button" class="menu-action" type="button">Close</button>
    </div>

    <div id="menu-confirm" class="menu-step" hidden>
      <h2 class="menu-title">Start over?</h2>
      <p class="menu-text">Betula and your whole collection will be erased. This can't be undone.</p>
      <button id="confirm-reset-button" class="menu-action danger" type="button">Yes, reset</button>
      <button id="cancel-reset-button" class="menu-action" type="button">Cancel</button>
    </div>
  </dialog>

  <script src="game.js"></script>

  <script data-goatcounter="https://berkanagames.goatcounter.com/count"
        async src="/count.js"></script>
</body>
</html>
