<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Betula Grows</title>
  <meta name="description" content="Look after Betula, a small birch tree, through a 24-hour life.">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="device">
    <h1 class="device-title">Betula Grows</h1>

    <div class="screen-frame">
      <canvas id="screen" class="screen" aria-label="Betula's screen"></canvas>
    </div>

    <button id="gift-message" class="gift-message" type="button" hidden></button>

    <div class="need-buttons">
      <button class="need-button" type="button" data-need="water">
        <span class="need-emoji" aria-hidden="true">💧</span>
        Water
      </button>
      <button class="need-button" type="button" data-need="sun">
        <span class="need-emoji" aria-hidden="true">☀️</span>
        Sun
      </button>
      <button class="need-button" type="button" data-need="company">
        <span class="need-emoji" aria-hidden="true">💚</span>
        Company
      </button>
    </div>

    <section class="shelf">
      <h2 class="shelf-title">Collection</h2>
      <div id="shelf" class="shelf-grid"></div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
